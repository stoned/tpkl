version: '2'
linters:
  default: 'all'
  disable:
  - 'depguard'
  - 'exhaustruct'
  - 'gochecknoinits'
  - 'gomodguard'  # superseded bu 'gomodguard_v2'
  - 'wsl'  # superseded by 'wsl_v5'
  exclusions:
    rules:
    - path: '_test\.go$'
      linters:
      - 'goconst'
      - 'godoclint'
    - path: 'cmd/eval.go'
      text: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
      linters:
      - 'gosec'
    - path: 'cmd/eval.go'
      text: 'G702: Command injection via taint analysis'
      linters:
      - 'gosec'
    - path: 'cmd/pklwrapper/pklwrapper.go'
      text: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
      linters:
      - 'gosec'
    - path: 'cmd/pklwrapper/pklwrapper.go'
      text: 'G702: Command injection via taint analysis'
      linters:
      - 'gosec'
    - path: 'log/log.go'
      linters:
      - 'goconst'
    - path: 'log/log.go'
      text: 'var-naming: avoid package names that conflict with Go standard library package names'
      linters:
      - 'revive'
    - path: 'tasks/run.go'
      text: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
      linters:
      - 'gosec'
    - path: 'tasks/frame.go'
      text: '_[^ ]+ is a global variable'
      linters:
      - 'gochecknoglobals'
    - path: 'tasks/frame_env_test.go'
      text: 'Function [^ ]+ missing the call to method parallel'
      linters:
      - 'paralleltest'
    - path: 'tasks/frame_env_test.go'
      text: "Function 'setupFrames' is too long"
      linters:
      - 'funlen'
    - path: 'tasks/bin_test.go'
      text: 'G204: Subprocess launched with variable'
      linters:
      - 'gosec'
    - path: 'tasks/bin_test.go'
      text: 'cognitive complexity \d+ of func `TestSigHandler` is high'
      linters:
      - 'gocognit'
    - path: 'tasks/bin_test.go'
      text: 'calculated cyclomatic complexity for function TestSigHandler is \d+'
      linters:
      - 'cyclop'
    - path: 'tasks/run.go'
      text: "Function 'runTask' is too long"
      linters:
      - 'funlen'
    - path: 'tasks/tasks.go'
      text: 'exported func With.* returns unexported type \*tasks\..*Option'
      linters:
      - 'revive'
    - source: '^func Test'
      linters:
      - 'funlen'
    paths:
    - 'internal/expansion/.*\.go$'
  settings:
    forbidigo:
      forbid:
      - pattern: '^spew\.(ConfigState\.)?Dump$'
    gosec:
      config:
        G306: '0644'
    mnd:
      ignored-functions:
      - '^os\.WriteFile'
      - '^os\.Exit'
    musttag:
      functions:
      - name: '(*encoding/json.Decoder).Decode'
        tag: 'pkl'
        arg-pos: 0
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
formatters:
  enable:
  - 'gofumpt'
  exclusions:
    paths:
    - 'internal/expansion/.*\.go$'
